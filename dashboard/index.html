<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maricopa Motivated Seller Leads</title>
<style>
  /* ── reset & base ─────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #0d1117;
    --surface:  #161b22;
    --border:   #30363d;
    --text:     #e6edf3;
    --muted:    #8b949e;
    --accent:   #2563eb;
    --green:    #22c55e;
    --yellow:   #eab308;
    --red:      #ef4444;
    --orange:   #f97316;
    --purple:   #a855f7;
    --radius:   8px;
    --font:     "Inter", system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }

  /* ── header ───────────────────────────────────────────────────────────── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; font-weight: 700; flex: 1; }
  header h1 span { color: var(--accent); }
  #run-info { font-size: 12px; color: var(--muted); }

  /* ── stats bar ────────────────────────────────────────────────────────── */
  #stats {
    display: flex;
    gap: 12px;
    padding: 16px 24px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 20px;
    min-width: 120px;
    text-align: center;
  }
  .stat-card .val { font-size: 26px; font-weight: 700; }
  .stat-card .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* ── controls ─────────────────────────────────────────────────────────── */
  #controls {
    display: flex;
    gap: 10px;
    padding: 0 24px 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  input[type="text"], select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 7px 12px;
    font-size: 13px;
    outline: none;
  }
  input[type="text"]:focus, select:focus { border-color: var(--accent); }
  #search { width: 260px; }

  button {
    padding: 7px 16px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }
  .btn-green { background: var(--green); color: #000; }
  .btn-green:hover { background: #16a34a; }

  /* ── table ────────────────────────────────────────────────────────────── */
  #table-wrap { overflow-x: auto; padding: 0 24px 40px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 10px 12px;
    text-align: left;
    font-weight: 600;
    white-space: nowrap;
    position: sticky;
    top: 0;
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { background: var(--border); }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:hover { background: rgba(37,99,235,0.07); }
  tbody td { padding: 9px 12px; vertical-align: top; }

  /* ── badges ───────────────────────────────────────────────────────────── */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-NS { background: #ef444422; color: #ef4444; }
  .badge-FL { background: #f9731622; color: #f97316; }
  .badge-SL { background: #eab30822; color: #eab308; }
  .badge-DE { background: #a855f722; color: #a855f7; }
  .badge-PD, .badge-PJ { background: #22c55e22; color: #22c55e; }
  .badge-flag {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    margin: 1px;
    font-size: 10px;
  }
  .badge-AUCTION_SOON { border-color: var(--red);    color: var(--red); }
  .badge-ABSENTEE_OWNER { border-color: var(--yellow); color: var(--yellow); }
  .badge-HIGH_VALUE { border-color: var(--purple); color: var(--purple); }

  /* ── score pill ───────────────────────────────────────────────────────── */
  .score {
    display: inline-block;
    width: 38px;
    text-align: center;
    padding: 3px 6px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 12px;
  }
  .score-hi  { background: #ef444433; color: #ef4444; }
  .score-med { background: #eab30833; color: #eab308; }
  .score-lo  { background: #8b949e22; color: #8b949e; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  #loading { text-align: center; padding: 60px; color: var(--muted); font-size: 16px; }
  #empty   { text-align: center; padding: 60px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>🏠 <span>Maricopa</span> Motivated Seller Leads</h1>
  <div id="run-info">Loading…</div>
  <button class="btn-green" onclick="exportCSV()">⬇ Export GHL CSV</button>
</header>

<div id="stats">
  <div class="stat-card"><div class="val" id="s-total">—</div><div class="lbl">Total Leads</div></div>
  <div class="stat-card"><div class="val" id="s-addr">—</div><div class="lbl">With Address</div></div>
  <div class="stat-card"><div class="val" id="s-nts">—</div><div class="lbl">Trustee Sales</div></div>
  <div class="stat-card"><div class="val" id="s-lien">—</div><div class="lbl">Tax Liens</div></div>
  <div class="stat-card"><div class="val" id="s-soon">—</div><div class="lbl">Auction ≤30d</div></div>
</div>

<div id="controls">
  <input type="text" id="search" placeholder="🔍  Search name, address, parcel, doc#…" oninput="applyFilters()" />
  <select id="filter-type" onchange="applyFilters()">
    <option value="">All Lead Types</option>
    <option value="NS">Notice of Trustee Sale</option>
    <option value="FL">Federal Tax Lien</option>
    <option value="SL">State Tax Lien</option>
    <option value="DE">Tax Deed</option>
    <option value="PD">Probate</option>
  </select>
  <select id="filter-flag" onchange="applyFilters()">
    <option value="">All Flags</option>
    <option value="AUCTION_SOON">Auction Soon</option>
    <option value="ABSENTEE_OWNER">Absentee Owner</option>
    <option value="HIGH_VALUE">High Value</option>
  </select>
  <select id="sort-by" onchange="applyFilters()">
    <option value="score">Sort: Score ↓</option>
    <option value="filed">Sort: Date Filed ↓</option>
    <option value="amount">Sort: Loan Amount ↓</option>
    <option value="auction_date">Sort: Auction Date ↑</option>
  </select>
  <button class="btn-secondary" onclick="resetFilters()">Reset</button>
  <span id="count-label" style="color:var(--muted);font-size:12px;margin-left:8px;"></span>
</div>

<div id="table-wrap">
  <div id="loading">Loading lead data…</div>
  <table id="leads-table" style="display:none">
    <thead>
      <tr>
        <th>Score</th>
        <th>Type</th>
        <th>Filed</th>
        <th>Owner</th>
        <th>Mailing Address</th>
        <th>Property Address</th>
        <th>Parcel</th>
        <th>Loan $</th>
        <th>Auction Date</th>
        <th>Trustee</th>
        <th>Flags</th>
        <th>Doc #</th>
        <th>Links</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty" style="display:none">No records match your filters.</div>
</div>

<script>
let ALL_RECORDS = [];
let FETCHED_AT  = "";
let DATE_RANGE  = {};

const TYPE_LABELS = {
  NS: "Notice of Trustee Sale", FL: "Federal Tax Lien",
  SL: "State Tax Lien", DE: "Tax Deed", PD: "Probate", PJ: "Probate",
};

// ── Load data ───────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const resp = await fetch("records.json?t=" + Date.now());
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();

    ALL_RECORDS = data.records || [];
    FETCHED_AT  = data.fetched_at || "";
    DATE_RANGE  = data.date_range || {};

    updateRunInfo(data);
    updateStats(data);
    applyFilters();

    document.getElementById("loading").style.display = "none";
    document.getElementById("leads-table").style.display = "";
  } catch (e) {
    document.getElementById("loading").textContent = "⚠️ Could not load records.json — " + e.message;
  }
}

function updateRunInfo(data) {
  const d = new Date(data.fetched_at);
  document.getElementById("run-info").textContent =
    `Updated: ${d.toLocaleString()} | ${DATE_RANGE.start} → ${DATE_RANGE.end}`;
}

function updateStats(data) {
  const recs = data.records || [];
  document.getElementById("s-total").textContent = recs.length;
  document.getElementById("s-addr").textContent  = recs.filter(r => r.prop_address).length;
  document.getElementById("s-nts").textContent   = recs.filter(r => r.lead_key === "NS").length;
  document.getElementById("s-lien").textContent  = recs.filter(r => ["FL","SL"].includes(r.lead_key)).length;
  const soon = recs.filter(r => {
    if (!r.auction_date) return false;
    const days = (new Date(r.auction_date) - Date.now()) / 86400000;
    return days >= 0 && days <= 30;
  }).length;
  document.getElementById("s-soon").textContent = soon;
}

// ── Filter + sort ────────────────────────────────────────────────────────────
function applyFilters() {
  const query = document.getElementById("search").value.toLowerCase();
  const type  = document.getElementById("filter-type").value;
  const flag  = document.getElementById("filter-flag").value;
  const sort  = document.getElementById("sort-by").value;

  let recs = ALL_RECORDS.filter(r => {
    if (type && r.lead_key !== type) return false;
    if (flag && !(r.flags || []).includes(flag)) return false;
    if (query) {
      const haystack = [
        r.owner, r.grantee, r.prop_address, r.mail_address,
        r.doc_num, r.parcel, r.prop_zip, r.trustee_name,
      ].join(" ").toLowerCase();
      if (!haystack.includes(query)) return false;
    }
    return true;
  });

  recs.sort((a, b) => {
    if (sort === "score")        return (b.score || 0) - (a.score || 0);
    if (sort === "filed")        return (b.filed || "").localeCompare(a.filed || "");
    if (sort === "amount")       return (b.amount || 0) - (a.amount || 0);
    if (sort === "auction_date") return (a.auction_date || "9999").localeCompare(b.auction_date || "9999");
    return 0;
  });

  document.getElementById("count-label").textContent = `${recs.length} record(s)`;
  renderTable(recs);
}

function resetFilters() {
  document.getElementById("search").value = "";
  document.getElementById("filter-type").value = "";
  document.getElementById("filter-flag").value = "";
  document.getElementById("sort-by").value = "score";
  applyFilters();
}

// ── Render ───────────────────────────────────────────────────────────────────
function renderTable(recs) {
  const tbody = document.getElementById("tbody");
  const empty = document.getElementById("empty");

  if (!recs.length) {
    tbody.innerHTML = "";
    empty.style.display = "";
    return;
  }
  empty.style.display = "none";

  tbody.innerHTML = recs.map(r => {
    const score = r.score || 0;
    const scoreCls = score >= 70 ? "score-hi" : score >= 40 ? "score-med" : "score-lo";
    const lk = r.lead_key || "??";

    const flags = (r.flags || []).map(f =>
      `<span class="badge badge-flag badge-${f}">${f.replace(/_/g," ")}</span>`
    ).join(" ");

    const loan = r.amount ? "$" + Number(r.amount).toLocaleString() : "—";
    const auction = r.auction_date || "—";
    const owner = r.owner || "—";

    const mailAddr = [r.mail_address, r.mail_city, r.mail_state, r.mail_zip]
      .filter(Boolean).join(", ") || "—";
    const propAddr = [r.prop_address, r.prop_city, r.prop_state, r.prop_zip]
      .filter(Boolean).join(", ") || "—";

    const links = [];
    if (r.clerk_url) links.push(`<a href="${r.clerk_url}" target="_blank">Clerk</a>`);
    if (r.pdf_url)   links.push(`<a href="${r.pdf_url}"   target="_blank">PDF</a>`);

    return `<tr>
      <td><span class="score ${scoreCls}">${score}</span></td>
      <td><span class="badge badge-${lk}">${lk}</span></td>
      <td style="white-space:nowrap">${r.filed || "—"}</td>
      <td>${owner}</td>
      <td>${mailAddr}</td>
      <td>${propAddr}</td>
      <td style="white-space:nowrap">${r.parcel || "—"}</td>
      <td style="white-space:nowrap">${loan}</td>
      <td style="white-space:nowrap">${auction}</td>
      <td>${r.trustee_name || "—"}</td>
      <td>${flags || "—"}</td>
      <td style="white-space:nowrap">${r.doc_num || "—"}</td>
      <td>${links.join(" · ") || "—"}</td>
    </tr>`;
  }).join("");
}

// ── GHL CSV Export ───────────────────────────────────────────────────────────
function exportCSV() {
  const cols = [
    "First Name","Last Name","Mailing Address","Mailing City","Mailing State","Mailing Zip",
    "Property Address","Property City","Property State","Property Zip",
    "Lead Type","Document Type","Date Filed","Document Number",
    "Original Loan","Trustee Name","Trustee Phone","Auction Date","PDF URL",
  ];

  const typeMap = {
    NS:"Notice of Trustee Sale", FL:"Federal Tax Lien",
    SL:"State Tax Lien", DE:"Tax Deed", PD:"Probate Document", PJ:"Probate Document",
  };

  const rows = [cols.join(",")];
  for (const r of ALL_RECORDS) {
    const loan = r.amount ? "$" + Number(r.amount).toLocaleString() : "";
    const row = [
      r.first_name   || "", r.last_name    || "",
      r.mail_address || "", r.mail_city    || "", r.mail_state || "", r.mail_zip || "",
      r.prop_address || "", r.prop_city    || "", r.prop_state || "AZ", r.prop_zip || "",
      typeMap[r.lead_key] || r.cat_label || "",
      r.doc_type || "", r.filed || "", r.doc_num || "",
      loan, r.trustee_name || "", r.trustee_phone || "", r.auction_date || "", r.pdf_url || "",
    ].map(v => `"${String(v).replace(/"/g,'""')}"`);
    rows.push(row.join(","));
  }

  const blob = new Blob([rows.join("\n")], { type: "text/csv" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = `maricopa_leads_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

loadData();
</script>
</body>
</html>

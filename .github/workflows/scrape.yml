name: Maricopa Lead Scraper

on:
  schedule:
    - cron: "0 7 * * *"   # 7:00 AM UTC daily (midnight AZ time)
  workflow_dispatch:        # manual trigger

permissions:
  contents: write
  pages:    write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      # ── checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── dependencies ──────────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            beautifulsoup4 \
            lxml \
            playwright \
            python-dateutil \
            openpyxl \
            pdfplumber \
            pillow \
            pytesseract \
            img2pdf \
            dbfread

      # ── playwright browsers ────────────────────────────────────────────────
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # ── create output dirs ─────────────────────────────────────────────────
      - name: Create output directories
        run: |
          mkdir -p data dashboard scraper raw_png grouped_output/renamed grouped_output/pdfs parsed_output

      # ── run scraper ────────────────────────────────────────────────────────
      - name: Run lead scraper
        env:
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '7' }}
          PYTHONUNBUFFERED: "1"
        run: python scraper/fetch.py

      # ── commit results ─────────────────────────────────────────────────────
      - name: Commit updated records
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/records.json dashboard/records.json data/ghl_export.csv || true
          git add scraper/scraper.log || true

          CHANGES=$(git diff --cached --name-only | wc -l)
          if [ "$CHANGES" -gt "0" ]; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            TOTAL=$(python -c "import json; d=json.load(open('data/records.json')); print(d.get('total',0))" 2>/dev/null || echo "?")
            git commit -m "🏠 Leads update: ${TOTAL} records — ${TIMESTAMP}"
            git push
          else
            echo "No changes to commit."
          fi

      # ── deploy dashboard to GitHub Pages ──────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

  deploy-pages:
    needs: scrape
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

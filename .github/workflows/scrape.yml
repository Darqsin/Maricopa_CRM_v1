name: Maricopa Lead Scraper

on:
  schedule:
    - cron: "0 7 * * *"

  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD) — leave blank to use LOOKBACK_DAYS"
        required: false
        default: ""
      end_date:
        description: "End date (YYYY-MM-DD) — leave blank for today"
        required: false
        default: ""
      lookback_days:
        description: "Days to look back (used only if start_date is blank)"
        required: false
        default: "7"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            beautifulsoup4 \
            lxml \
            playwright \
            python-dateutil \
            openpyxl \
            pdfplumber \
            pillow \
            pytesseract \
            img2pdf \
            dbfread

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Create output directories
        run: |
          mkdir -p data dashboard scraper raw_png \
            grouped_output/renamed grouped_output/pdfs parsed_output

      - name: Run lead scraper
        env:
          # If manually triggered with dates, use those; otherwise use lookback
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE:   ${{ github.event.inputs.end_date }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || vars.LOOKBACK_DAYS || '7' }}
          PYTHONUNBUFFERED: "1"
        run: python scraper/fetch.py

      - name: Download NTS document PNGs
        run: python scraper/download_pngs.py

      - name: Group PNGs into PDFs
        run: python maricopa_nts_png_v01.py

      - name: Parse NTS PDFs to Excel and CSV
        run: python maricopa_nts_parser_v01.py

      - name: Commit all outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/records.json dashboard/records.json || true
          git add data/ghl_export.csv || true
          git add parsed_output/nts_data.xlsx parsed_output/nts_data.csv || true
          git add grouped_output/pdfs/ || true
          git add scraper/scraper.log || true

          CHANGES=$(git diff --cached --name-only | wc -l)
          if [ "$CHANGES" -gt "0" ]; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            TOTAL=$(python -c "import json; d=json.load(open('data/records.json')); print(d.get('total',0))" 2>/dev/null || echo "?")
            git commit -m "🏠 Leads update: ${TOTAL} records — ${TIMESTAMP}"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

  deploy-pages:
    needs: scrape
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
